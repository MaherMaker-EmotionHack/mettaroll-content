name: Fix Section Heading Accents

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-section-heading-accents.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Align headings and gold accent lines
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidates = [
              Path('mettaroll/src/styles.scss'),
              Path('mettaroll/src/styles.css'),
          ]
          path = next((item for item in candidates if item.exists()), None)
          if path is None:
              raise SystemExit('Could not find the global Angular stylesheet')

          marker = '/* Mettaroll section heading accents */'
          text = path.read_text(encoding='utf-8')
          if marker in text:
              raise SystemExit('Section heading accent rules already exist')

          rules = r'''

          /* Mettaroll section heading accents */
          app-products-page .section__title {
            margin-bottom: 0 !important;
            text-align: center !important;
          }

          app-products-page .section__title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            margin: 16px auto 40px;
            background: #bfa370;
          }

          app-contact-page .team-section__title,
          app-contact-page .office-section__heading {
            text-align: center !important;
          }

          app-contact-page .team-section__underline,
          app-contact-page .office-section__underline {
            display: block;
            width: 80px !important;
            height: 3px;
            margin-inline: auto !important;
            background: #bfa370;
          }

          app-contact-page .team-section__underline {
            margin-top: 16px !important;
            margin-bottom: 24px !important;
          }

          app-contact-page .office-section__underline {
            margin-top: 16px !important;
            margin-bottom: 32px !important;
          }

          @media (max-width: 768px) {
            app-products-page .section__title::after {
              margin-bottom: 32px;
            }

            app-contact-page .team-section__title,
            app-contact-page .office-section__heading {
              padding-inline: 16px;
            }
          }
          '''

          path.write_text(text.rstrip() + rules + '\n', encoding='utf-8')
          print(path)
          PY

          grep -RFn 'Mettaroll section heading accents' mettaroll/src
          grep -RFn 'app-products-page .section__title::after' mettaroll/src
          grep -RFn 'app-contact-page .team-section__underline' mettaroll/src
          git diff --check
          git diff -- mettaroll/src

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site update
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src
          git diff --cached --check
          git commit -m 'Align section headings and gold accent lines'
          git push origin HEAD:main
