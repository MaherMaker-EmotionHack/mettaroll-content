name: Fix Google Maps Embed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-google-map-embed.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Use the approved Google Maps address safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('site/mettaroll/src')
          matches = [
              path for path in root.rglob('*.html')
              if 'office-section__iframe' in path.read_text(encoding='utf-8')
          ]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one contact template, found {matches}')

          path = matches[0]
          text = path.read_text(encoding='utf-8')
          replacement = (
              'src="https://www.google.com/maps?'
              'q=Wilhelminakade%20173%2C%203072%20AP%20Rotterdam%2C%20Netherlands'
              '&amp;output=embed"'
          )
          updated, count = re.subn(
              r'\[src\]\s*=\s*"[^"]*page\(\)\.office\.map_embed_url[^"]*"',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Dynamic Google Maps source binding not found')

          path.write_text(updated, encoding='utf-8')
          print(f'Updated {path}')
          PY

      - name: Build website
        shell: bash
        working-directory: site/mettaroll
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn build
          else
            npm ci
            npm run build
          fi

      - name: Commit and push website changes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mettaroll/src
          git diff --cached --quiet && exit 0
          git commit -m "Render the Rotterdam Google Maps embed"
          git push origin main
