name: Inspect Site Routing Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-site-routing.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site
          persist-credentials: false

      - name: Locate product links and scroll routing
        working-directory: site
        shell: bash
        run: |
          mapfile -t candidate_files < <(
            find . -type f \
              \( -iname '*product*.ts' -o -iname '*product*.html' \
                 -o -iname '*contact*.ts' -o -iname '*contact*.html' \
                 -o -iname '*route*.ts' -o -iname 'app.config.ts' \) \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              | sort
          )

          printf '%s\n' "${candidate_files[@]}"

          for file in "${candidate_files[@]}"; do
            grep -n -E -C 4 \
              '(router|href|link|navigate|slug|contact|scroll|viewport)' \
              "$file" || true
          done > "$RUNNER_TEMP/site-routing-matches.txt"

          sed -n '1,700p' "$RUNNER_TEMP/site-routing-matches.txt"
