name: Fix Homepage Product Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-product-images.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Replace homepage product images
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail

          replace_image() {
            local old="$1"
            local new="$2"
            mapfile -t matches < <(git grep -l -F "$old" -- mettaroll/src || true)

            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly one source reference for %s, found %s\n' "$old" "${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi

            sed -i "s|$old|$new|g" "${matches[0]}"
          }

          replace_image \
            'landing-page-products-01.jpeg' \
            'exec-29318621-3b2a-4f11-a6c7-4f3d44a1d87e.png'
          replace_image \
            'landing-page-products-02.jpg' \
            'exec-6f400cef-320f-4db8-89f2-a7386a837f99.png'
          replace_image \
            'landing-page-products-03.jpg' \
            'sheets-for-product-page.jpeg'

          ! git grep -F 'landing-page-products-01.jpeg' -- mettaroll/src
          ! git grep -F 'landing-page-products-02.jpg' -- mettaroll/src
          ! git grep -F 'landing-page-products-03.jpg' -- mettaroll/src
          git diff --check
          git diff -- mettaroll/src

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site fix
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src
          git diff --cached --check
          git commit -m 'Use CMS category images on homepage'
          git push origin HEAD:main
