name: Fix Site Product and Contact Navigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Apply focused navigation fixes
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail

          card_html='mettaroll/src/app/components/cards/product-card.component.html'
          detail_html='mettaroll/src/app/pages/product-detail-page.component.html'
          detail_ts='mettaroll/src/app/pages/product-detail-page.component.ts'
          app_config='mettaroll/src/app/app.config.ts'

          grep -Fq "[href]=\"'/products/' + category() + '/' + slug()\"" "$card_html"
          grep -Fq 'href="/contact"' "$detail_html"
          grep -Fq "import { provideRouter } from '@angular/router';" "$app_config"
          grep -Fq 'provideRouter(routes)' "$app_config"

          sed -i "s|\[href\]=\"'/products/' + category() + '/' + slug()\"|[href]=\"link()\"|" "$card_html"
          sed -i 's|href="/contact"|[href]="contactLink()"|' "$detail_html"
          sed -i "s|import { ContentService } from '../services/content.service';|import { ContentService } from '../services/content.service';\nimport { LanguageService } from '../services/language.service';|" "$detail_ts"
          sed -i "s|  private content = inject(ContentService);|  private content = inject(ContentService);\n  private lang = inject(LanguageService);|" "$detail_ts"
          sed -i "s|  product = computed|  protected contactLink = computed(() => \`/\${this.lang.currentLang()}/contact\`);\n\n  product = computed|" "$detail_ts"
          sed -i "s|url: \`/products/\${this.catSlug}/\${this.slug}\`|url: \`/\${this.lang.currentLang()}/products/\${this.catSlug}/\${this.slug}\`|" "$detail_ts"
          sed -i "s|import { provideRouter } from '@angular/router';|import { provideRouter, withInMemoryScrolling } from '@angular/router';|" "$app_config"
          sed -i "s|provideRouter(routes)|provideRouter(routes, withInMemoryScrolling({ scrollPositionRestoration: 'top' }))|" "$app_config"

          grep -Fq '[href]="link()"' "$card_html"
          grep -Fq '[href]="contactLink()"' "$detail_html"
          grep -Fq "scrollPositionRestoration: 'top'" "$app_config"
          git diff --check
          git diff -- "$card_html" "$detail_html" "$detail_ts" "$app_config"

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site fix
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add \
            mettaroll/src/app/app.config.ts \
            mettaroll/src/app/components/cards/product-card.component.html \
            mettaroll/src/app/pages/product-detail-page.component.html \
            mettaroll/src/app/pages/product-detail-page.component.ts
          git diff --cached --check
          git commit -m 'Fix localized product and contact navigation'
          git push origin HEAD:main
