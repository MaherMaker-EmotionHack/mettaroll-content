name: Fix Language Switch And Product Layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-language-switch-and-product-layout.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Make language switching complete and restyle specifications
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('mettaroll/src')
          language_updates = 0
          language_files = []

          def replace_language_anchor(match):
              global language_updates
              tag = match.group(0)
              if 'navbar__lang-btn' not in tag:
                  return tag

              updated, count = re.subn(
                  r'\[routerLink\]\s*=\s*"([^"]+)"',
                  r'[attr.href]="\1"',
                  tag,
              )
              if count == 0:
                  updated, count = re.subn(
                      r'(?<!\[)\brouterLink\s*=\s*"([^"]+)"',
                      r'href="\1"',
                      tag,
                  )
              language_updates += count
              return updated

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'navbar__lang-btn' not in text:
                  continue
              updated = re.sub(r'<a\b[^>]*navbar__lang-btn[^>]*>', replace_language_anchor, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  language_files.append(path)

          if language_updates < 1:
              raise SystemExit('No router-based language link was found')

          candidates = [root / 'styles.scss', root / 'styles.css']
          style_path = next((item for item in candidates if item.exists()), None)
          if style_path is None:
              raise SystemExit('Could not find the global Angular stylesheet')

          marker = '/* Mettaroll product specification cards */'
          styles = style_path.read_text(encoding='utf-8')
          if marker in styles:
              raise SystemExit('Product specification card rules already exist')

          rules = r'''

          /* Mettaroll product specification cards */
          .product-detail__desc {
            max-width: 680px;
            color: #173b61;
            font-weight: 500;
            line-height: 1.65;
          }

          .product-detail__body {
            margin-top: 26px;
          }

          .product-detail__body h2 {
            margin: 24px 0 12px;
            color: #bfa370;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.045em;
            line-height: 1.3;
            text-transform: uppercase;
          }

          .product-detail__body ul {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 0 0 18px;
            padding: 0;
            list-style: none;
          }

          .product-detail__body li {
            margin: 0;
            padding: 11px 13px;
            border-inline-start: 3px solid #bfa370;
            border-radius: 6px;
            background: #f3f5f7;
            color: #26384b;
            line-height: 1.45;
          }

          .product-detail__body li strong {
            display: block;
            margin-bottom: 2px;
            color: #173b61;
            font-size: 0.82rem;
            letter-spacing: 0.025em;
            text-transform: uppercase;
          }

          .product-detail__body > p:last-child {
            margin: 12px 0 22px;
            color: #647383;
            font-size: 0.86rem;
            line-height: 1.5;
          }

          @media (max-width: 768px) {
            .product-detail__body ul {
              grid-template-columns: 1fr;
            }

            .product-detail__body h2 {
              margin-top: 20px;
            }
          }
          '''

          style_path.write_text(styles.rstrip() + rules + '\n', encoding='utf-8')
          print('Updated language navigation:', ', '.join(map(str, language_files)))
          print('Updated product detail styles:', style_path)
          PY

          grep -RFn 'Mettaroll product specification cards' mettaroll/src
          grep -RFn 'navbar__lang-btn' mettaroll/src | head -20
          ! grep -RFnF '[routerLink]' mettaroll/src | grep -F 'navbar__lang-btn'
          git diff --check
          git diff -- mettaroll/src

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site update
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src
          git diff --cached --check
          git commit -m 'Fix language switching and product detail layout'
          git push origin HEAD:main
