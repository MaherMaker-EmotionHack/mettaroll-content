name: Localize Static Website Interface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/localize-static-interface.yml

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Localize hardcoded product and contact interface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('site/mettaroll/src')

          def find_one(needle, suffix):
              matches = [p for p in root.rglob(f'*{suffix}') if needle in p.read_text(encoding='utf-8')]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {suffix} file containing {needle!r}, found {matches}')
              return matches[0]

          def save(path, before, after):
              if before == after:
                  raise RuntimeError(f'No change made to {path}')
              path.write_text(after, encoding='utf-8')
              print(f'Updated {path}')

          product_page = find_one('Products by', '.html')
          text = product_page.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'<span([^>]*)>Products by</span>\s*<br\s*/?>\s*<span([^>]*)>Category</span>',
              r'<span\1>{{ $any(lang.ui().labels).products_by }}</span>',
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Products-by heading pattern not found')
          updated = updated.replace('CONTACT US!', '{{ lang.ui().footer.contact_us.toUpperCase() }}!', 1)
          save(product_page, text, updated)

          product_card = find_one('View Products', '.html')
          text = product_card.read_text(encoding='utf-8')
          updated = text.replace('View Products', '{{ viewProductsLabel }}', 1)
          save(product_card, text, updated)

          card_ts_candidates = [p for p in product_card.parent.glob('*.ts') if 'export class ProductCategoryCardComponent' in p.read_text(encoding='utf-8')]
          if len(card_ts_candidates) != 1:
              raise RuntimeError(f'Product card TypeScript file not found: {card_ts_candidates}')
          card_ts = card_ts_candidates[0]
          text = card_ts.read_text(encoding='utf-8')
          marker = 'export class ProductCategoryCardComponent {'
          labels = """
            readonly viewProductsLabel = ({
              en: 'View Products',
              de: 'Produkte ansehen',
              nl: 'Producten bekijken',
              ar: 'عرض المنتجات',
            } as Record<string, string>)[document.documentElement.lang] ?? 'View Products';
          """
          updated = text.replace(marker, marker + labels, 1)
          save(card_ts, text, updated)

          contact_page = find_one('steel manufacturing solutions', '.html')
          text = contact_page.read_text(encoding='utf-8')
          updated = text
          replacements = [
              ('Get in Touch', '{{ $any(page()).intro_heading }}'),
              ('Ready to start your project or you need more information about our steel manufacturing solutions?', '{{ $any(page()).intro_body }}'),
              ('Fill out the form below.', '{{ $any(page()).intro_instruction }}'),
              ('Get in Touch', '{{ $any(page()).whatsapp_heading }}'),
              ('Via WhatsAPP', '{{ $any(page()).whatsapp_subheading }}'),
              ('Message us on WhatsApp', '{{ $any(page()).whatsapp_button }}'),
              ('Address', '{{ $any(page()).address_label }}'),
          ]
          for old, new in replacements:
              if old not in updated:
                  raise RuntimeError(f'Contact text not found: {old}')
              updated = updated.replace(old, new, 1)
          save(contact_page, text, updated)

          contact_form = find_one('Select your country', '.html')
          text = contact_form.read_text(encoding='utf-8')
          updated = text
          form_text = {
              'First Name': '{{ labels.firstName }}',
              'Company': '{{ labels.company }}',
              'Email': '{{ labels.email }}',
              'Phone Number': '{{ labels.phone }}',
              'Country': '{{ labels.country }}',
              'Select your country': '{{ labels.selectCountry }}',
              'Netherlands': '{{ labels.netherlands }}',
              'Germany': '{{ labels.germany }}',
              'Belgium': '{{ labels.belgium }}',
              'France': '{{ labels.france }}',
              'United Kingdom': '{{ labels.unitedKingdom }}',
              'Saudi Arabia': '{{ labels.saudiArabia }}',
              'UAE': '{{ labels.uae }}',
              'Other': '{{ labels.other }}',
              'Message': '{{ labels.message }}',
              'Send Message': '{{ labels.sendMessage }}',
          }
          for old, new in form_text.items():
              pattern = rf'(?<=>){re.escape(old)}(?=<)'
              updated, count = re.subn(pattern, new, updated, count=1)
              if count != 1:
                  raise RuntimeError(f'Form text not found: {old}')
          if 'placeholder="How can we help you?"' not in updated:
              raise RuntimeError('Message placeholder not found')
          updated = updated.replace('placeholder="How can we help you?"', '[placeholder]="labels.messagePlaceholder"', 1)
          save(contact_form, text, updated)

          form_ts_candidates = [p for p in contact_form.parent.glob('*.ts') if 'export class ContactFormComponent' in p.read_text(encoding='utf-8')]
          if len(form_ts_candidates) != 1:
              raise RuntimeError(f'Contact form TypeScript file not found: {form_ts_candidates}')
          form_ts = form_ts_candidates[0]
          text = form_ts.read_text(encoding='utf-8')
          marker = 'export class ContactFormComponent {'
          labels = r'''
            readonly labels = (() => {
              const translations: Record<string, Record<string, string>> = {
                en: { firstName: 'First Name', company: 'Company', email: 'Email', phone: 'Phone Number', country: 'Country', selectCountry: 'Select your country', netherlands: 'Netherlands', germany: 'Germany', belgium: 'Belgium', france: 'France', unitedKingdom: 'United Kingdom', saudiArabia: 'Saudi Arabia', uae: 'UAE', other: 'Other', message: 'Message', messagePlaceholder: 'How can we help you?', sendMessage: 'Send Message' },
                de: { firstName: 'Vorname', company: 'Unternehmen', email: 'E-Mail', phone: 'Telefonnummer', country: 'Land', selectCountry: 'Wählen Sie Ihr Land', netherlands: 'Niederlande', germany: 'Deutschland', belgium: 'Belgien', france: 'Frankreich', unitedKingdom: 'Vereinigtes Königreich', saudiArabia: 'Saudi-Arabien', uae: 'VAE', other: 'Sonstiges', message: 'Nachricht', messagePlaceholder: 'Wie können wir Ihnen helfen?', sendMessage: 'Nachricht senden' },
                nl: { firstName: 'Voornaam', company: 'Bedrijf', email: 'E-mail', phone: 'Telefoonnummer', country: 'Land', selectCountry: 'Selecteer uw land', netherlands: 'Nederland', germany: 'Duitsland', belgium: 'België', france: 'Frankrijk', unitedKingdom: 'Verenigd Koninkrijk', saudiArabia: 'Saoedi-Arabië', uae: 'VAE', other: 'Overig', message: 'Bericht', messagePlaceholder: 'Hoe kunnen wij u helpen?', sendMessage: 'Bericht versturen' },
                ar: { firstName: 'الاسم الأول', company: 'الشركة', email: 'البريد الإلكتروني', phone: 'رقم الهاتف', country: 'الدولة', selectCountry: 'اختر دولتك', netherlands: 'هولندا', germany: 'ألمانيا', belgium: 'بلجيكا', france: 'فرنسا', unitedKingdom: 'المملكة المتحدة', saudiArabia: 'المملكة العربية السعودية', uae: 'الإمارات العربية المتحدة', other: 'أخرى', message: 'الرسالة', messagePlaceholder: 'كيف يمكننا مساعدتك؟', sendMessage: 'إرسال الرسالة' },
              };
              return translations[document.documentElement.lang] ?? translations['en'];
            })();
          '''
          updated = text.replace(marker, marker + labels, 1)
          save(form_ts, text, updated)

          for path in root.rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('Wilhelminakade 139, Rotterdam', 'Wilhelminakade 173, Rotterdam')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Updated {path}')
          PY

      - name: Build website
        shell: bash
        working-directory: site/mettaroll
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn build
          else
            npm ci
            npm run build
          fi

      - name: Commit and push website changes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mettaroll/src
          git diff --cached --quiet && exit 0
          git commit -m "Localize product and contact interface"
          git push origin main
