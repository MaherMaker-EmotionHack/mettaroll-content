name: Correct Homepage Strip and Sheet Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-homepage-strip-sheet-images.yml

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Replace incorrect strip and sheet motives
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          home_file='mettaroll/src/app/pages/home-page.component.ts'

          grep -Fq 'homepage-product-strips.png' "$home_file"
          grep -Fq 'homepage-product-sheets.jpeg' "$home_file"

          sed -i \
            's|homepage-product-strips.png|homepage-product-strips-v2.png|g' \
            "$home_file"
          sed -i \
            's|homepage-product-sheets.jpeg|homepage-product-sheets-v2.png|g' \
            "$home_file"

          grep -Fq 'homepage-product-strips-v2.png' "$home_file"
          grep -Fq 'homepage-product-sheets-v2.png' "$home_file"
          git diff --check
          git diff -- mettaroll/src/app/pages/home-page.component.ts

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site update
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src/app/pages/home-page.component.ts
          git diff --cached --check
          git commit -m 'Correct homepage strip and sheet images'
          git push origin HEAD:main
