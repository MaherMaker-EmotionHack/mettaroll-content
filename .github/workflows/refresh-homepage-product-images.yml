name: Refresh Homepage Product Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-homepage-product-images.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private site repository
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Use dedicated homepage product image files
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          home_file='mettaroll/src/app/pages/home-page.component.ts'

          grep -Fq 'exec-29318621-3b2a-4f11-a6c7-4f3d44a1d87e.png' "$home_file"
          grep -Fq 'exec-6f400cef-320f-4db8-89f2-a7386a837f99.png' "$home_file"
          grep -Fq 'sheets-for-product-page.jpeg' "$home_file"

          sed -i \
            's|exec-29318621-3b2a-4f11-a6c7-4f3d44a1d87e.png|homepage-product-strips.png|g' \
            "$home_file"
          sed -i \
            's|exec-6f400cef-320f-4db8-89f2-a7386a837f99.png|homepage-product-coils.png|g' \
            "$home_file"
          sed -i \
            's|sheets-for-product-page.jpeg|homepage-product-sheets.jpeg|g' \
            "$home_file"

          grep -Fq 'homepage-product-strips.png' "$home_file"
          grep -Fq 'homepage-product-coils.png' "$home_file"
          grep -Fq 'homepage-product-sheets.jpeg' "$home_file"
          git diff --check
          git diff -- mettaroll/src/app/pages/home-page.component.ts

      - name: Build site
        working-directory: site/mettaroll
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push private site update
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src/app/pages/home-page.component.ts
          git diff --cached --check
          git commit -m 'Refresh homepage product images'
          git push origin HEAD:main
