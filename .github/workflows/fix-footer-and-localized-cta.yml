name: Fix Footer and Localized Quote CTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-footer-and-localized-cta.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Fix footer and localized quote link
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('site/mettaroll/src')

          footer_matches = [p for p in root.rglob('*.html') if 'STEEL EXCELLENCE' in p.read_text(encoding='utf-8')]
          if len(footer_matches) != 1:
              raise RuntimeError(f'Expected one footer template, found {footer_matches}')
          footer = footer_matches[0]
          text = footer.read_text(encoding='utf-8')
          updated = text.replace('STEEL EXCELLENCE', '{{ settings.tagline }}', 1)
          if '{{ settings.company_name }}.' not in updated:
              raise RuntimeError('Copyright company-name pattern not found')
          updated = updated.replace('{{ settings.company_name }}.', '{{ settings.company_name }}', 1)
          footer.write_text(updated, encoding='utf-8')
          print(f'Updated {footer}')

          cta_matches = [p for p in root.rglob('*.html') if '[href]="cta.button_link"' in p.read_text(encoding='utf-8')]
          if len(cta_matches) != 1:
              raise RuntimeError(f'Expected one CTA template, found {cta_matches}')
          cta = cta_matches[0]
          text = cta.read_text(encoding='utf-8')
          updated = text.replace('[href]="cta.button_link"', '[href]="\'/\' + lang.currentLang() + \'/contact\'"', 1)
          cta.write_text(updated, encoding='utf-8')
          print(f'Updated {cta}')
          PY

      - name: Build website
        shell: bash
        working-directory: site/mettaroll
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn build
          else
            npm ci
            npm run build
          fi

      - name: Commit and push website changes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mettaroll/src
          git diff --cached --quiet && exit 0
          git commit -m "Fix footer branding and localize quote CTA"
          git push origin main
