name: Localize SEO Titles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/localize-seo-titles.yml

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Localize product category SEO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('site/mettaroll/src')
          matches = [
              path for path in root.rglob('*.ts')
              if 'Steel Products | Mettaroll' in path.read_text(encoding='utf-8')
          ]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one product category component, found {matches}')

          path = matches[0]
          source = path.read_text(encoding='utf-8')
          needle_at = source.index('Steel Products | Mettaroll')
          start = source.rfind('  constructor()', 0, needle_at)
          if start < 0:
              raise RuntimeError('Product category constructor not found')

          brace_start = source.find('{', start)
          depth = 0
          end = None
          for index in range(brace_start, len(source)):
              if source[index] == '{':
                  depth += 1
              elif source[index] == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise RuntimeError('Could not determine constructor boundary')

          replacement = '''  constructor() {
            const category = this.content.getCategory(this.categorySlug);
            const categoryName = category?.name ?? 'Products';
            const language = document.documentElement.lang;
            const productLabels: Record<string, string> = {
              en: 'Steel Products',
              de: 'Stahlprodukte',
              nl: 'Staalproducten',
              ar: 'منتجات الصلب',
            };
            const descriptionPrefixes: Record<string, string> = {
              en: `Explore Mettaroll's range in the ${categoryName} category.`,
              de: `Entdecken Sie Mettarolls Sortiment in der Kategorie ${categoryName}.`,
              nl: `Ontdek het assortiment van Mettaroll in de categorie ${categoryName}.`,
              ar: `تعرّف على مجموعة ميتارول ضمن فئة ${categoryName}.`,
            };
            const descriptionFallbacks: Record<string, string> = {
              en: 'Contact us for current availability and specifications.',
              de: 'Kontaktieren Sie uns für aktuelle Verfügbarkeit und Spezifikationen.',
              nl: 'Neem contact met ons op voor actuele beschikbaarheid en specificaties.',
              ar: 'تواصل معنا لمعرفة التوافر الحالي والمواصفات.',
            };
            const categoryDescription = category?.description?.slice(0, 150) ?? '';

            this.seo.update({
              title: `${categoryName} — ${productLabels[language] ?? productLabels['en']} | Mettaroll`,
              description: categoryDescription
                ? `${descriptionPrefixes[language] ?? descriptionPrefixes['en']} ${categoryDescription}`
                : descriptionFallbacks[language] ?? descriptionFallbacks['en'],
              url: `/products/${this.categorySlug}`,
              image: category?.hero_image,
            });
          }'''

          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          print(f'Updated {path}')
          PY

          git -C site diff --check
          git -C site diff -- mettaroll/src

      - name: Build website
        shell: bash
        working-directory: site/mettaroll
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push website changes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Localize category SEO titles and descriptions'
          git push origin HEAD:main
