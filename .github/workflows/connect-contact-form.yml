name: Connect Contact Form

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-contact-form.yml

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website
        uses: actions/checkout@v4
        with:
          repository: MaherMaker-EmotionHack/mettaroll-site
          token: ${{ secrets.MAIN_REPO_PAT }}
          path: site

      - name: Connect form to free email delivery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('site/mettaroll/src')

          def find_one(needle, suffix):
              matches = [p for p in root.rglob(f'*{suffix}') if needle in p.read_text(encoding='utf-8')]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {suffix} file containing {needle!r}, found {matches}')
              return matches[0]

          def replace_once(text, old, new, description):
              if old not in text:
                  raise RuntimeError(f'{description} not found')
              return text.replace(old, new, 1)

          form_ts = find_one('export class ContactFormComponent', '.ts')
          source = form_ts.read_text(encoding='utf-8')

          label_replacements = {
              "sendMessage: 'Send Message' }": "sendMessage: 'Send Message', sending: 'Sending…', successMessage: 'Thank you! Your inquiry has been sent.', errorMessage: 'The message could not be sent. Please try again or email info@mettaroll.com.' }",
              "sendMessage: 'Nachricht senden' }": "sendMessage: 'Nachricht senden', sending: 'Wird gesendet…', successMessage: 'Vielen Dank! Ihre Anfrage wurde gesendet.', errorMessage: 'Die Nachricht konnte nicht gesendet werden. Bitte versuchen Sie es erneut oder schreiben Sie an info@mettaroll.com.' }",
              "sendMessage: 'Bericht versturen' }": "sendMessage: 'Bericht versturen', sending: 'Wordt verzonden…', successMessage: 'Bedankt! Uw aanvraag is verzonden.', errorMessage: 'Het bericht kon niet worden verzonden. Probeer het opnieuw of mail naar info@mettaroll.com.' }",
              "sendMessage: 'إرسال الرسالة' }": "sendMessage: 'إرسال الرسالة', sending: 'جارٍ الإرسال…', successMessage: 'شكرًا لك! تم إرسال طلبك بنجاح.', errorMessage: 'تعذر إرسال الرسالة. يرجى المحاولة مرة أخرى أو مراسلتنا على info@mettaroll.com.' }",
          }
          for old, new in label_replacements.items():
              source = replace_once(source, old, new, f'Label entry {old}')

          marker = '  onSubmit(): void {'
          start = source.find(marker)
          if start < 0:
              raise RuntimeError('Contact form onSubmit method not found')
          brace_start = source.find('{', start)
          depth = 0
          end = None
          for index in range(brace_start, len(source)):
              if source[index] == '{':
                  depth += 1
              elif source[index] == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise RuntimeError('Could not determine end of onSubmit method')

          method = '''  isSubmitting = false;
          submitStatus: 'success' | 'error' | null = null;

          async onSubmit(): Promise<void> {
            if (this.form.invalid || this.isSubmitting) {
              this.form.markAllAsTouched();
              return;
            }

            this.isSubmitting = true;
            this.submitStatus = null;
            const values = this.form.getRawValue();

            try {
              const response = await fetch('https://formsubmit.co/ajax/info@mettaroll.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Accept: 'application/json',
                },
                body: JSON.stringify({
                  name: values.firstName,
                  company: values.company,
                  email: values.email,
                  phone: values.phone,
                  country: values.country,
                  message: values.message,
                  language: document.documentElement.lang.toUpperCase(),
                  source: window.location.href,
                  _subject: 'New Mettaroll website inquiry',
                  _template: 'table',
                }),
              });

              const result = (await response.json()) as { success?: boolean | string };
              if (!response.ok || (result.success !== true && result.success !== 'true')) {
                throw new Error('FormSubmit rejected the request');
              }

              this.form.reset();
              this.submitStatus = 'success';
            } catch (error) {
              console.error('Contact form submission failed', error);
              this.submitStatus = 'error';
            } finally {
              this.isSubmitting = false;
            }
          }'''
          source = source[:start] + method + source[end:]
          form_ts.write_text(source, encoding='utf-8')
          print(f'Updated {form_ts}')

          form_html = find_one('[formGroup]="form"', '.html')
          html = form_html.read_text(encoding='utf-8')
          html = replace_once(
              html,
              '[disabled]="form.invalid"',
              '[disabled]="form.invalid || isSubmitting"',
              'Submit button disabled binding',
          )
          html, label_count = re.subn(
              r'(<app-button\b[^>]*variant="contact-submit"[^>]*>).*?(</app-button>)',
              r'''\1
              {{ isSubmitting ? labels.sending : labels.sendMessage }}
            \2''',
              html,
              count=1,
              flags=re.S,
          )
          if label_count != 1:
              raise RuntimeError('Submit button label not found')
          status = '''
            <p
              class="contact-form__status contact-form__status--success"
              role="status"
              aria-live="polite"
              [hidden]="submitStatus !== 'success'"
            >
              {{ labels.successMessage }}
            </p>
            <p
              class="contact-form__status contact-form__status--error"
              role="alert"
              aria-live="assertive"
              [hidden]="submitStatus !== 'error'"
            >
              {{ labels.errorMessage }}
            </p>
          '''
          html = replace_once(html, '</form>', status + '</form>', 'Contact form closing tag')
          form_html.write_text(html, encoding='utf-8')
          print(f'Updated {form_html}')

          style_matches = [p for p in form_html.parent.glob('*.scss') if '.contact-form__submit' in p.read_text(encoding='utf-8')]
          if len(style_matches) != 1:
              raise RuntimeError(f'Expected one contact form stylesheet, found {style_matches}')
          style_path = style_matches[0]
          styles = style_path.read_text(encoding='utf-8')
          styles += '''

          .contact-form__status {
            margin: -8px 0 0;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-body);
            line-height: 1.5;
          }

          .contact-form__status[hidden] {
            display: none;
          }

          .contact-form__status--success {
            color: #185c37;
            background: #eaf7ef;
            border: 1px solid #8fcaa6;
          }

          .contact-form__status--error {
            color: #8b1e1e;
            background: #fff0f0;
            border: 1px solid #e0a0a0;
          }
          '''
          style_path.write_text(styles, encoding='utf-8')
          print(f'Updated {style_path}')
          PY

          git -C site diff --check
          git -C site diff -- mettaroll/src

      - name: Build website
        shell: bash
        working-directory: site/mettaroll
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
            npm run build
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Commit and push website changes
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'Mettaroll B.V.'
          git config user.email 'mettarollbv@gmail.com'
          git add mettaroll/src
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Connect website contact form'
          git push origin HEAD:main
